[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Connection URL is taken from the environment by migrations/env.py
sqlalchemy.url = postgresql+psycopg://app:app_pw_change_me@127.0.0.1:55435/target

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
