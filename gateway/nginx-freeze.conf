# Gateway freeze snippet — put the map block in the http{} section and the location
# block (or the server-level `if` block) in the server{} that fronts the member-data API.
#
# Behaviour required by the cutover runbook:
#   * POST / PUT / PATCH / DELETE  -> 503 with a maintenance notice
#   * GET / HEAD / OPTIONS         -> pass through untouched (read-only traffic keeps working)
#   * /health and /api/v1/freeze/status always pass, so the commander can see the state

map $request_method $cutover_freeze_method {
    default  0;
    POST     1;
    PUT      1;
    PATCH    1;
    DELETE   1;
}

map "$cutover_freeze_method:$uri" $cutover_freeze_active {
    default                     0;
    "1:/health"                 0;
    "1:/api/v1/freeze/status"   0;
    1                           1;
}

server {
    listen 443 ssl;
    server_name members.example.internal;      # fictional host

    # --- freeze gate -------------------------------------------------------
    # Flip by deploying this file with upstream traffic; removing it and reloading
    # lifts the freeze. No application restart is required.
    if ($cutover_freeze_active) {
        add_header Retry-After 3600 always;
        add_header Content-Type "application/json" always;
        return 503 '{"detail":"service_temporarily_frozen","message":"System is in cutover freeze window. Write operations are temporarily disabled and will resume after the cutover is complete."}';
    }

    location /health {
        proxy_pass http://member_api;
    }

    location /api/v1/freeze/status {
        proxy_pass http://member_api;
    }

    location / {
        proxy_pass http://member_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}

# Deployment / rollback (both are one command, logged in the cutover record):
#   deploy:  cp nginx-freeze.conf /etc/nginx/conf.d/cutover-freeze.conf && nginx -t && nginx -s reload
#   lift:    rm /etc/nginx/conf.d/cutover-freeze.conf         && nginx -t && nginx -s reload
# Record the moment the deploy command returns 0 as `freeze_at` in the cutover log and
# store the same value with:  scripts/cutover_incremental.py --record-freeze-at "<iso8601>"
