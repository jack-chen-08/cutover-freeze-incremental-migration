services:
  db:
    image: docker.1panel.live/library/postgres:16-alpine
    container_name: ms-cutover-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_pw_change_me
      POSTGRES_DB: source
    ports:
      - "55432:5432"
    volumes:
      - ./migrations/sql/0000_create_target_db.sql:/docker-entrypoint-initdb.d/0000_create_target_db.sql:ro
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d source"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pg_data:
