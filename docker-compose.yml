# Two independent PostgreSQL 16 instances: the member-space source (trial-run) and
# the new production target. The acceptance text asks for "two local PostgreSQL 16
# instances", so they are deliberately not two databases inside one server.
services:
  source-db:
    image: docker.1panel.live/library/postgres:16-alpine
    container_name: ms-cutover-source
    environment:
      POSTGRES_DB: source
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_pw_change_me
    ports:
      - "55432:5432"
    volumes:
      - source-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d source"]
      interval: 5s
      timeout: 3s
      retries: 20

  target-db:
    image: docker.1panel.live/library/postgres:16-alpine
    container_name: ms-cutover-target
    environment:
      POSTGRES_DB: target
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_pw_change_me
    ports:
      - "55435:5432"
    volumes:
      - target-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d target"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  source-data:
  target-data:
